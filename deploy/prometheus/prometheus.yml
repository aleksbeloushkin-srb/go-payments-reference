# Prometheus for the local stack: scrapes the payments admin listener and
# evaluates the alert rules. There is no Alertmanager here; firing alerts
# are visible at http://localhost:9091/alerts.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: payments
    static_configs:
      - targets: ["payments:9100"]
