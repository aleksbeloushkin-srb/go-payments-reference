name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x", "stable"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -s -l .)" || { gofmt -s -l .; exit 1; }
      - name: vet
        run: |
          go vet ./...
          go vet -tags integration ./...
      - name: test
        run: |
          set -o pipefail
          go test -race -count=1 -json ./... | go run ./scripts/testreport

  integration:
    name: integration (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x", "stable"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: integration tests (testcontainers PostgreSQL)
        run: |
          set -o pipefail
          go test -race -count=1 -tags integration -json ./... | go run ./scripts/testreport

  staticcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
      - run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - run: staticcheck -checks all ./...

  e2e:
    name: e2e (${{ matrix.start_mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        start_mode: [two_phase, in_tx]
    steps:
      - uses: actions/checkout@v5
      - name: validate Prometheus config and alert rules
        run: make check-alerts
      - name: build the image and run the end-to-end script with docker compose
        run: ./scripts/e2e.sh
        env:
          START_MODE: ${{ matrix.start_mode }}
