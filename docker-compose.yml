# Local stack: PostgreSQL, the payments service and the fake gateway.
#   docker compose up --build      then open http://localhost:8080
# The secrets below are development values; never reuse them anywhere else.

# Both services run binaries from the same image. If image builds stall on
# a VM-based Docker, see "Troubleshooting" in the README.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 3s
      retries: 30

  fakegateway:
    build: .
    image: go-payments-reference:dev
    entrypoint: ["/fakegateway"]
    environment:
      GATEWAY_ADDR: ":9090"
      GATEWAY_WEBHOOK_URL: http://payments:8080/v1/gateway/events
      GATEWAY_WEBHOOK_SECRET: dev-only-webhook-secret
      GATEWAY_SETTLE_DELAY: ${GATEWAY_SETTLE_DELAY:-1500ms}
      GATEWAY_LATENCY: ${GATEWAY_LATENCY:-0s}
    ports:
      - "9090:9090"

  payments:
    build: .
    image: go-payments-reference:dev
    depends_on:
      postgres:
        condition: service_healthy
      fakegateway:
        condition: service_started
    environment:
      PAYMENTS_DATABASE_URL: postgres://payments:payments@postgres:5432/payments?sslmode=disable
      PAYMENTS_GATEWAY_URL: http://fakegateway:9090
      PAYMENTS_WEBHOOK_SECRET: dev-only-webhook-secret
      PAYMENTS_ROLES: api,worker,relay
      # two_phase (v2, default) or in_tx (v1); see README, "v1 to v2".
      PAYMENTS_START_MODE: ${PAYMENTS_START_MODE:-two_phase}
      PAYMENTS_WORKER_CONCURRENCY: ${PAYMENTS_WORKER_CONCURRENCY:-4}
      PAYMENTS_DUPLICATE_CHECK_DELAY: ${PAYMENTS_DUPLICATE_CHECK_DELAY:-10m}
    ports:
      - "8080:8080"
      # Admin listener: /metrics, /healthz, /readyz. Published for local use
      # only; in a real deployment it stays on the cluster network.
      - "9100:9100"
    healthcheck:
      test: ["CMD", "/payments", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Drain delay + HTTP shutdown + the longest running task must fit.
    stop_grace_period: 60s

  # Scrapes the admin listener and evaluates deploy/prometheus/alerts.yml.
  # UI: http://localhost:9091 (9090 is taken by the fake gateway).
  prometheus:
    image: prom/prometheus:v3.5.0
    depends_on:
      payments:
        condition: service_healthy
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports:
      - "9091:9090"
